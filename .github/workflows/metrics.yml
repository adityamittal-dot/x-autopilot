name: metrics

on:
  schedule:
    - cron: '20 3 * * *'   # daily, 08:50 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-autopilot-metrics
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull engagement from Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node src/metrics.js

      - name: Rebuild report
        run: node scripts/report.js

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: data/report.html
          retention-days: 30

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "x-autopilot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: sync metrics $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing to commit"
          fi

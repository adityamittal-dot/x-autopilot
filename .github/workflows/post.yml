name: post

on:
  schedule:
    # Times are UTC. Each run writes every slot that is due (config.json → schedule.slots)
    # and hands Buffer a fixed publish time, so GitHub's cron delays (often hours) don't
    # make posts late. A slot opens writeAheadHours (9h) before its time and stays open
    # until skipIfLateHours (2h) after it; a run that GitHub drops or delays is caught up
    # by the next one, and a filled slot is never redone.
    #
    # Slots (America/New_York): weekdays 08:30, 11:00, 13:30, 16:00, 19:00 — weekends
    # 10:00, 13:30, 17:00. Five runs a day, every day (cron needs no DST awareness: the
    # same five UTC times cover both EDT and EST — see the table below).
    #
    #   run (UTC)   | covers (EDT, UTC-4)        | covers (EST, UTC-5)
    #   05:00       | 08:30 slot (7.5h ahead)    | 08:30 slot (8.5h ahead)
    #   08:30       | 11:00, 13:30 slots         | 08:30, 11:00 slots
    #   12:30       | 13:30, 16:00, 10:00(wk)    | 11:00, 13:30, 16:00, 10:00(wk)
    #   16:00       | 16:00, 19:00, 17:00(wk)    | 13:30, 16:00, 19:00, 17:00(wk)
    #   19:30       | 19:00 slot (catch-up)      | 19:00, 17:00(wk) (catch-up)
    #
    # Every slot, in both offsets, lands inside at least two of these runs' write-ahead
    # windows, with the first of them several hours before the slot (checked by simulating
    # a full EDT week and a full EST week against dueSlots).
    - cron: '0 5 * * *'
    - cron: '30 8 * * *'
    - cron: '30 12 * * *'
    - cron: '0 16 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'auto = fill the slots due now; a type = one post of that type, live in a few minutes'
        type: choice
        options: [auto, insight, bip, recap, tip, question, observation]
        default: auto
      dry_run:
        description: 'Generate and print without sending to Buffer'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-autopilot-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate and schedule
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TYPE: ${{ inputs.type || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node src/main.js

      # always(): if one slot fails, the posts the other slots queued must still be recorded,
      # or the next run would post them again.
      - name: Commit history
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "x-autopilot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: log post $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          else
            echo "nothing to commit"
          fi

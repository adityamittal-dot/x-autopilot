name: post

on:
  schedule:
    # Times are UTC. Each run writes every slot that is due (config.json → schedule.slots)
    # and hands Buffer a fixed publish time, so GitHub's cron delays (often hours) don't
    # make posts late. A slot opens writeAheadHours before its time; a run that GitHub
    # drops or delays is caught up by the next one, and a filled slot is never redone.
    - cron: '45 5 * * 1-5'   # morning slot  → goes live 09:30 New York
    - cron: '15 9 * * 1-5'   # midday slot   → 13:00 New York (Wed: build-in-public, Fri: weekly recap)
    - cron: '45 13 * * 1-5'  # evening slot  → 17:30 New York
    - cron: '45 17 * * 1-5'  # catch-up: fills any slot a dropped run missed
  workflow_dispatch:
    inputs:
      type:
        description: 'auto = fill the slots due now; a type = one post of that type, live in a few minutes'
        type: choice
        options: [auto, insight, bip, recap]
        default: auto
      dry_run:
        description: 'Generate and print without sending to Buffer'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-autopilot-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate and schedule
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TYPE: ${{ inputs.type || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node src/main.js

      # always(): if one slot fails, the posts the other slots queued must still be recorded,
      # or the next run would post them again.
      - name: Commit history
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "x-autopilot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: log post $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          else
            echo "nothing to commit"
          fi

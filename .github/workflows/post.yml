name: post

on:
  schedule:
    # Times are UTC. Runs early on purpose: GitHub can delay scheduled runs by hours,
    # so the post is generated in the morning and handed to Buffer with a fixed
    # publish time (config.json → schedule.publishAt, in the audience's timezone).
    - cron: '0 6 * * 1-5'    # Mon–Fri: AI/dev news post → goes live 10:00 New York
    - cron: '30 7 * * 5'     # Friday: weekly recap      → goes live 13:00 New York
  workflow_dispatch:
    inputs:
      type:
        description: 'Post type'
        type: choice
        options: [insight, recap]
        default: insight
      dry_run:
        description: 'Generate and print without sending to Buffer'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-autopilot-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate and schedule
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TYPE: ${{ inputs.type || (github.event.schedule == '30 7 * * 5' && 'recap' || 'insight') }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node src/main.js

      - name: Commit history
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "x-autopilot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: log post $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          else
            echo "nothing to commit"
          fi

name: post

on:
  schedule:
    # Times are UTC. These land at 19:30 IST Tue/Thu and 15:30 IST Sun,
    # which overlaps the US morning and the Indian evening.
    - cron: '0 14 * * 2'   # Tuesday
    - cron: '0 14 * * 4'   # Thursday
    - cron: '0 10 * * 0'   # Sunday
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and print without sending to Buffer'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: x-autopilot-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and schedule
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node src/main.js

      - name: Commit history
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "x-autopilot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: log post $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing to commit"
          fi
